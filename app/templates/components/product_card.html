{% from "components/order_button.html" import order_button %}
{% macro card(p) %}
<article class="card">
  <a href="{{ url_for('shop.detail', slug=p.slug) }}">
    {% if p.primary_image %}
    <img class="ph" style="width:100%;object-fit:cover" src="{{ url_for('static', filename=p.primary_image) }}" alt="{{ p.name }}">
    {% else %}
    <div class="ph">Product photo</div>
    {% endif %}
  </a>
  <div class="body">
    <h3><a href="{{ url_for('shop.detail', slug=p.slug) }}">{{ p.name }}</a></h3>
    <div class="price">{{ p.price|naira }}</div>
    <span class="tag">{{ p.availability_label }}</span>
    {{ order_button(p) }}
  </div>
</article>
{% endmacro %}
