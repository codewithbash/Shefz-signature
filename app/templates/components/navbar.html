<header>
 <div class="wrap nav">
  <a class="logo" href="{{ url_for('main.home') }}">SHEFz<small>SIGNATURE</small></a>
  <nav class="links" aria-label="Main">
   <a href="{{ url_for('main.home') }}">Home</a>
   <a href="{{ url_for('shop.index') }}">Shop</a>
   <a href="{{ url_for('main.home') }}#how">How it works</a>
   <a href="#contact">Contact</a>
  </nav>
  <div class="actions">
   {% if current_user.is_authenticated %}
   <a class="cartbtn" href="{{ url_for('auth.account') }}">Account</a>
   <form method="post" action="{{ url_for('auth.logout') }}" style="margin:0">
     <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
     <button class="cartbtn" style="background:none;cursor:pointer;font:inherit">Log out</button>
   </form>
   {% else %}
   <a class="cartbtn" href="{{ url_for('auth.login') }}">Log in</a>
   {% endif %}
   <a class="cartbtn" href="{{ url_for('cart.view') }}">Cart{% if cart_count %} ({{ cart_count }}){% endif %}</a>
   <a class="pill" href="https://wa.me/{{ wa_number }}">WhatsApp</a>
  </div>
 </div>
</header>
